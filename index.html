else if(a=='login'){au.busy=1;const em=val($('#app'),'email'),pw=rd('pw').value;render();try{await login(em,pw);au.busy=0;location.hash='#/home';render()}catch(x){au.busy=0;render();toast(x.message)}}
else if(a=='bk')backup();else if(a=='theme'&&b.tagName!='LABEL'){S.theme=dark()?'light':'dark';persist();render()}
else if(a=='go')location.hash='#/'+b.dataset.r;
else if(a=='c+')one('New course','Course name',v=>{S.courses.push({id:uid(),name:v,color:PAL[S.courses.length%PAL.length],subs:[]});save();render()});
else if(a=='s+')one('New subject','Subject name',v=>{g(id).subs.push({id:uid(),name:v,syl:[]});save();render()});
else if(a=='t+')one('Add syllabus topic','Topic',v=>{g(b.dataset.c).subs.find(s=>s.id==id).syl.push({id:uid(),t:v,d:0});save();render()});
else if(a=='tt'){const t=g(b.dataset.c).subs.find(s=>s.id==b.dataset.s).syl.find(x=>x.id==id);t.d=t.d?0:1;save();render()}
else if(a=='cx'){if(confirm('Delete this course and its MCQs?')){S.courses=S.courses.filter(c=>c.id!=id);S.q=S.q.filter(q=>q.c!=id);S.tests=S.tests.filter(t=>t.c!=id);save();location.hash='#/courses';render()}}
else if(a=='sx'){if(confirm('Delete this subject?')){const c=g(b.dataset.c);c.subs=c.subs.filter(s=>s.id!=id);S.q=S.q.filter(q=>q.s!=id);save();render()}}
else if(a=='up'){UP={c:b.dataset.c,s:id};$('#jf').click()}
else if(a=='nt')newTest();else if(a=='dt'){if(confirm('Delete this test?')){S.tests=S.tests.filter(t=>t.id!=id);delete S.saved[id];save();render()}}
else if(a=='run')startTest(S.tests.find(t=>t.id==id));
else if(a=='prac'){const p=shuf(S.q.filter(q=>q.s==id));if(!p.length)return toast('Upload MCQs for this subject first');begin({id:'p',name:'Practice: '+g(b.dataset.c).subs.find(s=>s.id==id).name},p,1)}
else if(a=='opt'){if(R.fin)return;const k=+b.dataset.k;if(R.prac&&R.ans[R.i]!=null)return;R.ans[R.i]=k;runUI();if(!R.prac&&R.i==R.qs.length-1){R.fin=1;setTimeout(finish,700)}}
else if(a=='nxt'){if(R.i==R.qs.length-1)finish();else{R.i++;runUI()}}else if(a=='prev'){R.i--;runUI()}
else if(a=='svr'){S.saved[R.t.id]={...R,fin:0};clr();R=null;save();render();toast('Test saved. Resume any time')}
else if(a=='rx'){if(R.prac){clr();R=null}else if(!R.t.timed){S.saved[R.t.id]={...R};clr();R=null;save();render();toast('Progress saved')}else toast('A timed test cannot be paused')}
else if(a=='done'){clr();render()}else if(a=='bm'){BF.m=b.dataset.v;render()}else if(a=='pe')editProfile();
else if(a=='syn'){S.dirty=1;await sync();toast(navigator.onLine?'Synced':'Offline: will sync later')}
else if(a=='out'){if(S.dirty&&!navigator.onLine&&!confirm('Unsynced data will be lost. Log out anyway?'))return;await sync();if(confirm('Log out and remove data from this device?')){S=Object.assign(DEF(),{theme:S.theme});persist();try{AW&&await AW.acc.deleteSession('current')}catch(x){}au.tab='in';render()}}});
addEventListener('hashchange',render);render();sync();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
